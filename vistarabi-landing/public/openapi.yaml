openapi: 3.0.0
info:
  title: VistaraBI API
  version: 1.0.0
  description: OpenAPI documentation for the VistaraBI intelligent analytics platform.
servers:
  - url: /api/v1
    description: V1 API
paths:
  /ai/health:
    get:
      summary: Health check for AI subsystem
      responses:
        '200':
          description: OK
  /report/generate:
    post:
      summary: Generate an Executive Board Report
      responses:
        '200':
          description: PDF generated
  /projects/{id}/dashboard:
    get:
      summary: Retrieve the dashboard state for a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dashboard state retrieved successfully